# Substack'teki yeni yazıları her gün otomatik olarak
# data/site-data.json'a yıldız olarak ekler ve commit'ler.
# Commit atılınca Vercel / GitHub Pages siteyi kendiliğinden
# yeniden yayınlar. Elle tetiklemek için: Actions sekmesi →
# "Substack senkronu" → Run workflow.
name: Substack senkronu

on:
  schedule:
    - cron: '30 6 * * *'   # her gün 06:30 UTC (TR saatiyle 09:30)
  workflow_dispatch:        # elle tetikleme

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: RSS'i çek ve yeni yazıları ekle
        run: node scripts/update-from-substack.mjs
      - name: Değişiklik varsa commit'le
        run: |
          if ! git diff --quiet data/site-data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/site-data.json
            git commit -m "Substack'ten yeni yazılar eklendi"
            git push
          else
            echo "Yeni yazı yok."
          fi
