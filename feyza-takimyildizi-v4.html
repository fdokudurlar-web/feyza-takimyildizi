<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feyza D. Okudurlar · Takımyıldızı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sky-0:#070B1A; --sky-1:#0E1530; --sky-2:#141C3E;
  --starlight:#F3EFE4; --ink-dim:#8B92B3;
  --sun:#FF9E45; --tek:#A78BFA; --ins:#6EE7D8; --eko:#86EFAC; --tas:#F9A8D4; --gold:#F7C873;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Space Grotesk',sans-serif; color:var(--starlight);
  background:radial-gradient(120% 90% at 50% 38%, var(--sky-2) 0%, var(--sky-1) 45%, var(--sky-0) 100%);
  overflow:hidden;
}
header{position:fixed; top:0; left:0; right:0; padding:26px 34px; display:flex; justify-content:space-between; align-items:flex-start; z-index:20; pointer-events:none}
.wordmark{pointer-events:auto}
.wordmark h1{font-family:'Fraunces',serif; font-weight:300; font-size:23px; letter-spacing:.04em}
.wordmark h1 em{font-style:italic; font-weight:400}
.wordmark p{font-size:12px; color:var(--ink-dim); letter-spacing:.22em; text-transform:uppercase; margin-top:4px}
.journey-btn{
  pointer-events:auto; font-family:'Space Grotesk',sans-serif; font-size:13px; letter-spacing:.08em;
  color:var(--gold); background:transparent; border:1px solid rgba(247,200,115,.35);
  border-radius:999px; padding:9px 18px; cursor:pointer; transition:all .25s;
}
.journey-btn:hover,.journey-btn:focus-visible{background:rgba(247,200,115,.12); border-color:var(--gold); outline:none}
.journey-btn.active{background:var(--gold); color:#3a2b08; border-color:var(--gold)}
#sky{position:fixed; inset:0; width:100%; height:100%}
.hub{cursor:pointer; outline:none}
.hub:hover .halo,.hub:focus-visible .halo{opacity:.95}
.hub:focus-visible .core{stroke:#fff; stroke-width:1}
.hub-label{font-family:'Fraunces',serif; font-size:19px; font-weight:500; fill:var(--starlight); letter-spacing:.03em}
.hub-sub{font-size:10.5px; fill:var(--ink-dim); letter-spacing:.18em; text-transform:uppercase}
.item-star{cursor:pointer; transition:opacity .35s}
.dimmed{opacity:.1; pointer-events:none}
.thread{transition:opacity .25s, stroke-width .25s; pointer-events:none}
.edge{transition:opacity .35s}
@media (prefers-reduced-motion: no-preference){
  .twinkle{animation:tw 3.4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:var(--o,.8)}50%{opacity:.15}}
  .pulse{animation:pl 2.8s ease-in-out infinite}
  @keyframes pl{0%,100%{opacity:.9}50%{opacity:.45}}
  .breathe{animation:br 5s ease-in-out infinite}
  @keyframes br{0%,100%{opacity:.55}50%{opacity:.3}}
  .sunbreathe{animation:sb 6s ease-in-out infinite}
  @keyframes sb{0%,100%{opacity:.8}50%{opacity:.55}}
  .journey-path{stroke-dasharray:6 8; animation:dash 26s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-560}}
}
#tip{position:fixed; z-index:30; pointer-events:none; background:rgba(12,18,40,.92); border:1px solid rgba(243,239,228,.14);
  border-radius:10px; padding:9px 13px; font-size:13px; max-width:250px; opacity:0; transition:opacity .15s; backdrop-filter:blur(6px)}
#tip .tt-type{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim); margin-bottom:3px}
#panel{
  position:fixed; top:0; right:0; bottom:0; width:min(400px,100%); z-index:25;
  background:linear-gradient(180deg, rgba(12,18,40,.96), rgba(7,11,26,.97));
  border-left:1px solid rgba(243,239,228,.1); backdrop-filter:blur(14px);
  transform:translateX(102%); transition:transform .38s cubic-bezier(.2,.8,.2,1);
  display:flex; flex-direction:column;
}
#panel.open{transform:translateX(0)}
.panel-head{padding:30px 30px 20px; border-bottom:1px solid rgba(243,239,228,.08)}
.panel-eyebrow{font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--ink-dim); display:flex; align-items:center; gap:8px}
.panel-eyebrow .dot{width:8px; height:8px; border-radius:50%}
.panel-head h2{font-family:'Fraunces',serif; font-weight:500; font-size:25px; margin-top:10px; line-height:1.2}
.panel-head p{font-size:13.5px; color:var(--ink-dim); margin-top:8px; line-height:1.55}
.panel-close{position:absolute; top:20px; right:20px; background:none; border:none; color:var(--ink-dim); font-size:22px; cursor:pointer; padding:6px; line-height:1}
.panel-close:hover{color:var(--starlight)}
.panel-body{overflow-y:auto; padding:14px 22px 30px; flex:1}
.item-card{display:block; text-decoration:none; color:inherit; padding:15px 14px; border-radius:12px; border:1px solid transparent; transition:all .2s; margin-bottom:4px}
.item-card:hover{background:rgba(243,239,228,.05); border-color:rgba(243,239,228,.1)}
.item-card .ic-type{font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim)}
.item-card .ic-title{font-size:15.5px; margin-top:4px; line-height:1.4}
.item-card .ic-themes{display:flex; gap:6px; margin-top:8px; align-items:center}
.item-card .ic-themes span{width:7px; height:7px; border-radius:50%}
.item-card .ic-themes small{font-size:10.5px; color:var(--ink-dim); letter-spacing:.06em}
.bio-links{display:flex; flex-direction:column; gap:10px; margin-top:18px}
.bio-links a{display:flex; justify-content:space-between; align-items:center; text-decoration:none; color:var(--starlight);
  border:1px solid rgba(243,239,228,.16); border-radius:12px; padding:14px 18px; font-size:14.5px; transition:all .2s}
.bio-links a:hover{border-color:var(--sun); background:rgba(255,158,69,.08)}
.bio-links a small{color:var(--ink-dim); font-size:11px; letter-spacing:.14em; text-transform:uppercase}
#legend{position:fixed; left:34px; bottom:28px; z-index:20; font-size:11.5px; color:var(--ink-dim); display:flex; gap:18px; letter-spacing:.05em}
#legend span{display:flex; align-items:center; gap:6px}
#legend svg{width:12px; height:12px; overflow:visible}
#hint{position:fixed; right:34px; bottom:28px; z-index:20; font-size:11.5px; color:var(--ink-dim); letter-spacing:.05em}
@media (max-width:640px){
  header{padding:18px 20px}
  .wordmark h1{font-size:18px}
  #legend{left:20px; bottom:18px; flex-wrap:wrap; gap:10px 14px; max-width:60%}
  #hint{display:none}
  .hub-label{font-size:16px}
}
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <h1>Feyza D. Okudurlar<em>.</em></h1>
    <p>düşünce takımyıldızım</p>
  </div>
  <button class="journey-btn" id="journeyBtn" aria-pressed="false">✦ AI Journey</button>
</header>

<svg id="sky" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" aria-label="Tema takımyıldızı haritası"></svg>

<div id="tip" role="status"></div>

<aside id="panel" aria-hidden="true">
  <div class="panel-head">
    <button class="panel-close" id="panelClose" aria-label="Kapat">×</button>
    <div class="panel-eyebrow" id="panelEyebrow"></div>
    <h2 id="panelTitle"></h2>
    <p id="panelDesc"></p>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<div id="legend"></div>
<div id="hint">bir yıldıza dokun → bağlı olduğu temalara süz</div>

<script>
/* =========================================================
   VERİ MODELİ — sitenin tek gerçek kaynağı.
   Yeni yıldız  = ITEMS dizisine bir satır.
   Yeni düğüm   = THEMES sözlüğüne bir giriş.
   Düğüm boyutu içerik sayısından, kenar parlaklığı ortak
   içerikten, orbit halkaları güneşe uzaklıktan hesaplanır.
   ========================================================= */
const THEMES = {
  bio:{name:'Feyza', sub:'merkez', hex:'#FF9E45', ray:'#FFD84D', hot:'#FFF3D6', x:455, y:335,
       desc:'Mimarlık kökenli, teknoloji ve toplum meraklısı. Yaşar Holding\'de yapay zekâ dönüşümü üzerine çalışıyorum; burada ise düşüncelerimin gökyüzünü buluyorsunuz.'},
  tek:{name:'Teknoloji & Yapay Zeka', sub:'tema', hex:'#A78BFA', hot:'#F4F0FF', x:250, y:160,
       desc:'Yapay zekâ, algoritmalar ve teknolojinin iç işleyişi — merakla, eleştirel bir gözle.'},
  ins:{name:'İnsan & Toplum', sub:'tema', hex:'#6EE7D8', hot:'#EAFFFB', x:730, y:245,
       desc:'Teknolojinin gündelik hayata, kuşaklara ve iş kültürüne dokunduğu her yer. Gen Z merceğiyle.'},
  eko:{name:'Ekonomi & Eşitlik', sub:'tema', hex:'#86EFAC', hot:'#F0FFF4', x:295, y:565,
       desc:'Emek, ücret, fırsat eşitliği ve otomasyonun ekonomik yüzü.'},
  tas:{name:'Tasarım & Estetik', sub:'tema', hex:'#F9A8D4', hot:'#FFF0F7', x:645, y:540,
       desc:'Tasarım düşüncesi, estetik ve oran — yakında: inovatif mimari yapılar, ekonominin tasarıma etkileri.'}
};

/* İleride içerik geldiğinde kendiliğinden parlayacak, planlanan kenarlar */
const PLANNED_EDGES = [['eko','tas']];

const TYPE_LABEL = {yazi:'Yazı', kitap:'Kitap', film:'Film', secki:'Seçki'};

const ITEMS = [
  {title:'Yapay zekâ işimizi elimizden mi alıyor?', type:'yazi', themes:['tek','eko'], link:'#', journey:true},
  {title:'Gen Z ofise neden dönmüyor?', type:'yazi', themes:['ins','eko'], link:'#'},
  {title:'Algoritmalar kimin için çalışır?', type:'yazi', themes:['tek','ins'], link:'#', journey:true},
  {title:'YZ okuryazarlığı bir lüks mü?', type:'yazi', themes:['tek','ins'], link:'#', journey:true},
  {title:'Weapons of Math Destruction — Cathy O\'Neil', type:'kitap', themes:['tek','eko'], link:'#'},
  {title:'Her (2013)', type:'film', themes:['tek','ins'], link:'#'},
  {title:'Bullshit Jobs — David Graeber', type:'kitap', themes:['eko'], link:'#'},
  {title:'Moda, kimlik ve kuşaklar', type:'yazi', themes:['tas','ins'], link:'#'},
  {title:'The Social Dilemma', type:'film', themes:['tek','ins'], link:'#'},
  {title:'Ücret şeffaflığı üzerine notlar', type:'yazi', themes:['eko'], link:'#'},
  {title:'Yapay zekâyla ilk prototipim', type:'yazi', themes:['tek'], link:'#', journey:true},
  {title:'Sessiz istifa gerçekten sessiz mi?', type:'yazi', themes:['ins'], link:'#'},
  {title:'Bu ay okuduklarım: YZ ve etik üzerine 5 makale', type:'secki', themes:['tek','ins'], link:'#'},
  {title:'İzleme listesi: teknoloji distopyaları', type:'secki', themes:['tek'], link:'#'},
  {title:'İyi tasarım kimin için?', type:'yazi', themes:['tas'], link:'#'}
];

const PORTALS = [
  {label:'Substack', sub:'yazılarım', url:'https://substack.com'},
  {label:'LinkedIn', sub:'profesyonel', url:'https://linkedin.com'}
];

/* ============ yardımcılar ============ */
const svgNS = 'http://www.w3.org/2000/svg';
const sky = document.getElementById('sky');
function el(tag, attrs, parent){
  const n = document.createElementNS(svgNS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  (parent||sky).appendChild(n); return n;
}
function hash(n){ n = (n*2654435761) % 4294967296; return Math.abs(n % 997); }
const motionOK = window.matchMedia('(prefers-reduced-motion: no-preference)').matches;

function countFor(id){ return ITEMS.filter(it=>it.themes.includes(id)).length; }
/* içerik sayısına göre boyut — karekök ölçek: fark hissedilir, ezici değil */
function hubSize(id){
  if(id==='bio') return {glow:78, core:16, mid:10.5, hot:5.5, spike:48};
  const c = Math.sqrt(countFor(id));
  return {glow:22+7*c, core:4.5+1.7*c, hot:2+0.7*c, spike:14+7.5*c};
}

/* ============ defs ============ */
const defs = el('defs',{});
Object.entries(THEMES).forEach(([id,t])=>{
  const g = el('radialGradient',{id:'glow-'+id}, defs);
  el('stop',{offset:'0%', 'stop-color':t.hex, 'stop-opacity':0.6}, g);
  el('stop',{offset:'100%', 'stop-color':t.hex, 'stop-opacity':0}, g);
});

/* ============ kenar ağırlıkları ============ */
const edgeCounts = {};
ITEMS.forEach(it=>{
  if(it.themes.length===2){
    const key = [...it.themes].sort().join('-');
    edgeCounts[key] = (edgeCounts[key]||0)+1;
  }
});

/* ============ dalgalı rota geometrisi (S-kıvrımlı kübik) ============ */
const B = THEMES.bio;
function lerp(a,b,t){ return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
const edgeCurves = {};
function curveFor(idA,idB){
  const key=[idA,idB].sort().join('-');
  if(!edgeCurves[key]){
    const [ka,kb]=key.split('-');
    const a=THEMES[ka], b=THEMES[kb];
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
    const nx=-dy/len, ny=dx/len;
    const seed = hash(key.length*31 + key.charCodeAt(0)*7 + key.charCodeAt(4)*13);
    const amp = len*(0.09 + (seed%7)/100);
    const s = (seed%2 ? 1 : -1);
    const p1=lerp(a,b,0.3), p2=lerp(a,b,0.7);
    edgeCurves[key]={a, b,
      c1:{x:p1.x+nx*amp*s, y:p1.y+ny*amp*s},
      c2:{x:p2.x-nx*amp*s, y:p2.y-ny*amp*s}};
  }
  return edgeCurves[key];
}
function cubicPoint(cv,t){
  const u=1-t;
  return {
    x: u*u*u*cv.a.x + 3*u*u*t*cv.c1.x + 3*u*t*t*cv.c2.x + t*t*t*cv.b.x,
    y: u*u*u*cv.a.y + 3*u*u*t*cv.c1.y + 3*u*t*t*cv.c2.y + t*t*t*cv.b.y
  };
}
function curveD(cv){
  return `M ${cv.a.x} ${cv.a.y} C ${cv.c1.x.toFixed(1)} ${cv.c1.y.toFixed(1)} ${cv.c2.x.toFixed(1)} ${cv.c2.y.toFixed(1)} ${cv.b.x} ${cv.b.y}`;
}

/* ============ katman 1: ortam yıldızları ============ */
const bgGroup = el('g',{});
for(let i=0;i<420;i++){
  const x = hash(i*7+1)%1000, y = hash(i*13+5)%700;
  const r = 0.4 + (hash(i*3+2)%11)/10;
  const o = 0.3 + (hash(i+9)%50)/100;
  const c = el('circle',{cx:x, cy:y, r:r, fill:'#FBF8EF', opacity:o, class:'twinkle'}, bgGroup);
  c.style.setProperty('--o', o);
  c.style.animationDelay = (hash(i*5+3)%34)/10 + 's';
}

/* ============ katman 2: orbit halkaları — her tema güneşin yörüngesinde ============ */
const orbitGroup = el('g',{});
Object.keys(THEMES).filter(k=>k!=='bio').forEach((k,i)=>{
  const t = THEMES[k];
  const dx=t.x-B.x, dy=t.y-B.y;
  const q = 0.55 + (hash(i*41+3)%20)/100;              /* eliptik basıklık, her orbit farklı */
  const rx = Math.hypot(dx, dy/q), ry = q*rx;
  const d = `M ${(B.x+rx).toFixed(1)} ${B.y} A ${rx.toFixed(1)} ${ry.toFixed(1)} 0 1 1 ${(B.x-rx).toFixed(1)} ${B.y} A ${rx.toFixed(1)} ${ry.toFixed(1)} 0 1 1 ${(B.x+rx).toFixed(1)} ${B.y}`;
  el('path',{d, fill:'none', stroke:'#F3EFE4', 'stroke-width':0.6, opacity:0.08}, orbitGroup);
  /* orbit üzerinde yavaşça süzülen ışıltı — hiçbir şeyi yerinden oynatmaz */
  if(motionOK){
    const spark = el('circle',{r:1.7, fill:t.hex, opacity:0.55}, orbitGroup);
    const m = el('animateMotion',{dur:(48+i*14)+'s', repeatCount:'indefinite', path:d}, spark);
  }
});

/* ============ katman 3: tema–tema kenarları (dalgalı, renk geçişli) ============ */
const edgeGroup = el('g',{});
function edgeGradient(key, a, b){
  const g = el('linearGradient',{id:'eg-'+key, gradientUnits:'userSpaceOnUse',
    x1:a.x, y1:a.y, x2:b.x, y2:b.y}, defs);
  el('stop',{offset:'0%','stop-color':a.hex}, g);
  el('stop',{offset:'100%','stop-color':b.hex}, g);
  return 'url(#eg-'+key+')';
}
Object.keys(edgeCounts).forEach(key=>{
  const cv = curveFor(...key.split('-'));
  const d = curveD(cv);
  const stroke = edgeGradient(key, cv.a, cv.b);
  /* tüm kenarlar eşit incelikte — parlaklık farkı yok */
  el('path',{d, fill:'none', stroke, 'stroke-width':1, opacity:0.32, 'stroke-linecap':'round', class:'edge'}, edgeGroup);
});
/* planlanan kenarlar: soluk, kesikli — içerik gelince kendiliğinden parlar */
PLANNED_EDGES.forEach(([ka,kb])=>{
  const key=[ka,kb].sort().join('-');
  if(edgeCounts[key]) return;
  const cv = curveFor(ka,kb);
  el('path',{d:curveD(cv), fill:'none', stroke:'#F3EFE4', 'stroke-width':0.8, opacity:0.13,
     'stroke-dasharray':'3 8', 'stroke-linecap':'round', class:'edge breathe'}, edgeGroup);
  const mid = cubicPoint(cv, 0.5);
  el('text',{class:'hub-sub', x:mid.x, y:mid.y+16, 'text-anchor':'middle', opacity:0.55}, edgeGroup).textContent = 'yakında';
});

/* ============ yıldız konumlandırma ============ */
function itemPos(item, i){
  if(item.themes.length===2){
    const cv = curveFor(item.themes[0], item.themes[1]);
    const t = 0.3 + (hash(i*11+4)%41)/100;
    const p = cubicPoint(cv, t);
    const dx=cv.b.x-cv.a.x, dy=cv.b.y-cv.a.y, len=Math.hypot(dx,dy);
    const off = (hash(i*17+6)%2 ? 1 : -1) * (9 + hash(i*23+8)%13);
    return { x:p.x + (-dy/len)*off, y:p.y + (dx/len)*off };
  }
  if(item.themes.length>2){
    let x=0,y=0;
    item.themes.forEach(th=>{ x+=THEMES[th].x; y+=THEMES[th].y; });
    x/=item.themes.length; y/=item.themes.length;
    return { x:x+(hash(i*19)%40)-20, y:y+(hash(i*27)%40)-20 };
  }
  const h = THEMES[item.themes[0]];
  const ang = (hash(i*29+2)%628)/100;
  const r = hubSize(item.themes[0]).glow + 22 + hash(i*31+7)%52;
  return {
    x: Math.min(950, Math.max(40, h.x + Math.cos(ang)*r)),
    y: Math.min(645, Math.max(60, h.y + Math.sin(ang)*r*0.85))
  };
}
ITEMS.forEach((it,i)=> it.pos = itemPos(it,i));

/* ============ katman 4: AI Journey yolu ============ */
const journeyItems = ITEMS.filter(it=>it.journey);
function smoothPath(pts){
  if(pts.length<2) return '';
  let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for(let i=1;i<pts.length-1;i++){
    const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
    d += ` Q ${pts[i].x.toFixed(1)} ${pts[i].y.toFixed(1)} ${mx.toFixed(1)} ${my.toFixed(1)}`;
  }
  const L = pts[pts.length-1];
  d += ` L ${L.x.toFixed(1)} ${L.y.toFixed(1)}`;
  return d;
}
const journeyPath = el('path',{d:smoothPath(journeyItems.map(it=>it.pos)), fill:'none',
  stroke:'#F7C873', 'stroke-width':1.4, opacity:0, class:'journey-path'});

/* ============ katman 5: çok temalı iplikler ============ */
const threadGroup = el('g',{});
ITEMS.forEach((it,i)=>{
  if(it.themes.length<2) return;
  it.threads = it.themes.map(th=>{
    const h = THEMES[th];
    const dx=h.x-it.pos.x, dy=h.y-it.pos.y, len=Math.hypot(dx,dy)||1;
    const c = {x:(it.pos.x+h.x)/2 - dy/len*len*0.1, y:(it.pos.y+h.y)/2 + dx/len*len*0.1};
    return el('path',{d:`M ${it.pos.x} ${it.pos.y} Q ${c.x.toFixed(1)} ${c.y.toFixed(1)} ${h.x} ${h.y}`, fill:'none',
      stroke:h.hex, 'stroke-width':0.7, opacity:0.15, 'stroke-dasharray':'1.5 4',
      class:'thread', 'data-idx':i}, threadGroup);
  });
});

/* ============ katman 6: içerik yıldızları ============ */
const shapes = {
  yazi:  (x,y,f)=> el('path',{d:`M ${x} ${y-6} L ${x+1.8} ${y-1.8} L ${x+6} ${y} L ${x+1.8} ${y+1.8} L ${x} ${y+6} L ${x-1.8} ${y+1.8} L ${x-6} ${y} L ${x-1.8} ${y-1.8} Z`, fill:f}),
  kitap: (x,y,f)=> el('circle',{cx:x, cy:y, r:4, fill:'none', stroke:f, 'stroke-width':1.5}),
  film:  (x,y,f)=> el('path',{d:`M ${x} ${y-5} L ${x+4.6} ${y+3.4} L ${x-4.6} ${y+3.4} Z`, fill:f}),
  secki: (x,y,f)=> el('path',{d:`M ${x-4.4} ${y-4.4} L ${x+4.4} ${y+4.4} M ${x+4.4} ${y-4.4} L ${x-4.4} ${y+4.4}`, fill:'none', stroke:f, 'stroke-width':1.8, 'stroke-linecap':'round'})
};
const tip = document.getElementById('tip');
const starGroup = el('g',{});
ITEMS.forEach((it,i)=>{
  let fill = THEMES[it.themes[0]].hex;
  if(it.themes.length>=2){
    const g = el('linearGradient',{id:'ig-'+i, x1:'0%', y1:'0%', x2:'100%', y2:'100%'}, defs);
    it.themes.forEach((th,k)=>{
      el('stop',{offset:(k/(it.themes.length-1))*100+'%', 'stop-color':THEMES[th].hex}, g);
    });
    fill = 'url(#ig-'+i+')';
  }
  const g = el('g',{class:'item-star', 'data-idx':i, tabindex:'0', role:'button', 'aria-label':it.title}, starGroup);
  el('circle',{cx:it.pos.x, cy:it.pos.y, r:11, fill:fill, opacity:0.16}, g);
  g.appendChild(shapes[it.type](it.pos.x, it.pos.y, fill));
  g.addEventListener('mousemove', e=>{
    tip.innerHTML = `<div class="tt-type">${TYPE_LABEL[it.type]} · ${it.themes.map(t=>THEMES[t].name).join(' + ')}</div>${it.title}`;
    tip.style.opacity = 1;
    tip.style.left = Math.min(window.innerWidth-270, e.clientX+16)+'px';
    tip.style.top = (e.clientY+14)+'px';
  });
  g.addEventListener('mouseenter', ()=> setThreads(i, true));
  g.addEventListener('mouseleave', ()=>{ tip.style.opacity = 0; setThreads(i, false); });
  g.addEventListener('focus', ()=> setThreads(i, true));
  g.addEventListener('blur', ()=> setThreads(i, false));
  const open = ()=> openTheme(it.themes[0], it.title);
  g.addEventListener('click', open);
  g.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); open();} });
});
function setThreads(idx, on){
  (ITEMS[idx].threads||[]).forEach(t=>{
    t.setAttribute('opacity', on ? 0.8 : 0.15);
    t.setAttribute('stroke-width', on ? 1.2 : 0.7);
  });
}

/* ============ katman 7: tema düğümleri — boyut = içerik sayısı ============ */
function spikePair(x, y, L, w, hex, op, parent, rot){
  const g = el('g', rot ? {transform:`rotate(${rot} ${x} ${y})`} : {}, parent);
  el('path',{d:`M ${x} ${y-L} L ${x+w} ${y} L ${x} ${y+L} L ${x-w} ${y} Z`, fill:hex, opacity:op}, g);
  el('path',{d:`M ${x-L} ${y} L ${x} ${y-w} L ${x+L} ${y} L ${x} ${y+w} Z`, fill:hex, opacity:op}, g);
}
Object.entries(THEMES).forEach(([id,t])=>{
  const isBio = id==='bio';
  const S = hubSize(id);
  const g = el('g',{class:'hub', tabindex:'0', role:'button', 'aria-label':t.name});
  el('circle',{class:'halo '+(isBio?'sunbreathe':'pulse'), cx:t.x, cy:t.y, r:S.glow, fill:'url(#glow-'+id+')', opacity:isBio?0.8:0.75}, g);
  if(isBio){
    /* güneş: 8 sarı kanat + geniş turuncu göbek */
    spikePair(t.x, t.y, S.spike, 2.6, t.ray, 0.65, g);
    spikePair(t.x, t.y, S.spike*0.62, 2.2, t.ray, 0.5, g, 45);
    el('circle',{class:'core', cx:t.x, cy:t.y, r:S.core, fill:t.hex}, g);
    el('circle',{cx:t.x, cy:t.y, r:S.mid, fill:'#FFC24B'}, g);
    el('circle',{cx:t.x, cy:t.y, r:S.hot, fill:t.hot, opacity:0.95}, g);
  } else {
    spikePair(t.x, t.y, S.spike, 1.8, t.hex, 0.5, g);
    el('circle',{class:'core', cx:t.x, cy:t.y, r:S.core, fill:t.hex}, g);
    el('circle',{cx:t.x, cy:t.y, r:S.hot, fill:t.hot, opacity:0.95}, g);
  }
  const above = t.y < 340;
  const ly = above ? t.y - (S.glow + 16) : t.y + S.glow + 26;
  el('text',{class:'hub-label', x:t.x, y:ly, 'text-anchor':'middle'}, g).textContent = t.name;
  el('text',{class:'hub-sub', x:t.x, y:ly + (above?-20:18), 'text-anchor':'middle'}, g).textContent =
    isBio ? 'bio · portallar' : countFor(id)+' yıldız';
  const open = ()=> openTheme(id);
  g.addEventListener('click', open);
  g.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); open();} });
});

/* ============ panel ============ */
const panel = document.getElementById('panel');
const pEyebrow = document.getElementById('panelEyebrow');
const pTitle = document.getElementById('panelTitle');
const pDesc = document.getElementById('panelDesc');
const pBody = document.getElementById('panelBody');

function openTheme(id, highlightTitle){
  const t = THEMES[id];
  pEyebrow.innerHTML = `<span class="dot" style="background:${t.hex}"></span> ${id==='bio' ? 'merkez yıldız' : 'tema düğümü'}`;
  pTitle.textContent = t.name;
  pDesc.textContent = t.desc;
  pBody.innerHTML = '';
  if(id==='bio'){
    const wrap = document.createElement('div');
    wrap.className = 'bio-links';
    PORTALS.forEach(p=>{
      const a = document.createElement('a');
      a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = `${p.label} <small>${p.sub} ↗</small>`;
      wrap.appendChild(a);
    });
    pBody.appendChild(wrap);
  } else {
    ITEMS.filter(it=>it.themes.includes(id)).forEach(it=>{
      const a = document.createElement('a');
      a.className = 'item-card'; a.href = it.link;
      if(highlightTitle && it.title===highlightTitle) a.style.borderColor = t.hex;
      const others = it.themes.filter(th=>th!==id);
      a.innerHTML = `<div class="ic-type">${TYPE_LABEL[it.type]}${it.journey ? ' · ✦ AI Journey' : ''}</div>
        <div class="ic-title">${it.title}</div>
        <div class="ic-themes">${it.themes.map(th=>`<span style="background:${THEMES[th].hex}" title="${THEMES[th].name}"></span>`).join('')}
        ${others.length ? `<small>ayrıca: ${others.map(th=>THEMES[th].name).join(', ')}</small>` : ''}</div>`;
      pBody.appendChild(a);
    });
  }
  panel.classList.add('open');
  panel.setAttribute('aria-hidden','false');
  dimTo(id);
}
document.getElementById('panelClose').addEventListener('click', closePanel);
function closePanel(){
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden','true');
  if(!journeyOn) undim();
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closePanel(); if(journeyOn) toggleJourney(); } });

/* ============ süzme / soluklaştırma ============ */
function dimTo(id){
  document.querySelectorAll('.item-star').forEach(s=>{
    const it = ITEMS[+s.dataset.idx];
    const off = id!=='bio' && !it.themes.includes(id);
    s.classList.toggle('dimmed', off);
    (it.threads||[]).forEach(t=> t.setAttribute('opacity', off ? 0 : 0.15));
  });
}
function undim(){
  document.querySelectorAll('.item-star').forEach(s=>{
    s.classList.remove('dimmed');
    (ITEMS[+s.dataset.idx].threads||[]).forEach(t=> t.setAttribute('opacity', 0.15));
  });
}

/* ============ AI Journey ============ */
let journeyOn = false;
const jBtn = document.getElementById('journeyBtn');
jBtn.addEventListener('click', toggleJourney);
function toggleJourney(){
  journeyOn = !journeyOn;
  jBtn.classList.toggle('active', journeyOn);
  jBtn.setAttribute('aria-pressed', journeyOn);
  journeyPath.setAttribute('opacity', journeyOn ? 0.75 : 0);
  document.querySelectorAll('.item-star').forEach(s=>{
    const it = ITEMS[+s.dataset.idx];
    const off = journeyOn && !it.journey;
    s.classList.toggle('dimmed', off);
    (it.threads||[]).forEach(t=> t.setAttribute('opacity', off ? 0 : 0.15));
  });
  if(journeyOn){
    pEyebrow.innerHTML = `<span class="dot" style="background:#F7C873"></span> yol · takımyıldız çizgisi`;
    pTitle.textContent = 'AI Journey';
    pDesc.textContent = 'Yapay zekâyla yazdığım, okuduğum ve denediğim her şeyi birbirine bağlayan yol — profesyonel ve kişisel deneyimlerim, kronolojik bir hikâye olarak.';
    pBody.innerHTML = '';
    journeyItems.forEach((it,i)=>{
      const a = document.createElement('a');
      a.className = 'item-card'; a.href = it.link;
      a.innerHTML = `<div class="ic-type">${String(i+1).padStart(2,'0')} · ${TYPE_LABEL[it.type]}</div>
        <div class="ic-title">${it.title}</div>`;
      pBody.appendChild(a);
    });
    panel.classList.add('open'); panel.setAttribute('aria-hidden','false');
  } else { closePanel(); undim(); }
}

/* ============ gösterge ============ */
const legend = document.getElementById('legend');
const legendShapes = {
  yazi:'<svg viewBox="-7 -7 14 14"><path d="M0-6 1.8-1.8 6 0 1.8 1.8 0 6 -1.8 1.8 -6 0 -1.8-1.8Z" fill="#F3EFE4"/></svg>',
  kitap:'<svg viewBox="-7 -7 14 14"><circle r="4" fill="none" stroke="#F3EFE4" stroke-width="1.5"/></svg>',
  film:'<svg viewBox="-7 -7 14 14"><path d="M0-5 4.6 3.4 -4.6 3.4Z" fill="#F3EFE4"/></svg>',
  secki:'<svg viewBox="-7 -7 14 14"><path d="M-4.4-4.4 4.4 4.4 M4.4-4.4 -4.4 4.4" stroke="#F3EFE4" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>'
};
Object.entries(TYPE_LABEL).forEach(([k,v])=>{
  legend.innerHTML += `<span>${legendShapes[k]} ${v.toLowerCase()}</span>`;
});
</script>
